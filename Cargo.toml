[workspace]
resolver = "3"
members = [
  "crates/mono-core",
  "crates/mono-project",
  "apps/mono-cli",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/2023violet/MonoOLED-Studio"

[workspace.dependencies]
mono-core = { path = "crates/mono-core" }
mono-project = { path = "crates/mono-project" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
indexmap = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Style-only lints kept off so V1-mirroring control flow stays readable.
collapsible_if = "allow"
match_like_matches_macro = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
