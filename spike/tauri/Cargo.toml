[package]
name = "spike-tauri"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: the spike must not touch the product workspace or its lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde_json = "1"

[profile.release]
opt-level = 3
