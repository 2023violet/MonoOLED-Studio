[package]
name = "spike-slint"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: the spike must not touch the product workspace or its lockfile.
[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[profile.release]
opt-level = 3
