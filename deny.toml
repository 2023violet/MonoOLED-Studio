# cargo-deny policy for the Rust rewrite (ADR-005). Every new dependency needs a
# stated reason in the commit that adds it; this file only enforces licences,
# advisories and sources.
[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # ttf-parser (via ab_glyph, TrueType glyph generation in mono-font) is flagged unmaintained;
  # no safe upgrade exists. Inputs are user-chosen local font files; revisit with skrifa.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, not a vulnerability; no alternative release" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
