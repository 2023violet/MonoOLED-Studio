# Windows: link the C runtime statically so the release .exe runs on machines
# without the Visual C++ Redistributable (G5 install requirement).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
