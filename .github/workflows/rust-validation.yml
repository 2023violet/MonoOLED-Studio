name: Rust Validation

on:
  push:
    branches:
      - rust
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-matrix:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            xvfb \
            weston

      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        shell: bash
        run: cargo test --workspace --locked

      - name: Run Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release workspace
        shell: bash
        run: cargo build --workspace --release --locked

      - name: Run Rust Golden CLI
        shell: bash
        run: cargo run --locked -p mono_cli -- test_assets/rust_v2/goldens.json

      - name: GUI evidence (Windows)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: ./target/release/mono_desktop.exe --evidence target/evidence_windows.json

      - name: GUI evidence (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: ./target/release/mono_desktop --evidence target/evidence_macos.json

      - name: GUI evidence (Xvfb/X11)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 \
            ./target/release/mono_desktop --evidence target/evidence_x11.json

      - name: GUI evidence (weston/Wayland attempt)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: |
          weston --backend=headless-backend.so --socket=wayland-evidence \
            --width=1280 --height=800 --idle-time=0 &
          WESTON_PID=$!
          sleep 2
          set +e
          env WAYLAND_DISPLAY=wayland-evidence WINIT_UNIX_BACKEND=wayland \
            LIBGL_ALWAYS_SOFTWARE=1 \
            ./target/release/mono_desktop --evidence target/evidence_wayland.json \
            2>target/wayland_attempt.txt
          STATUS=$?
          set -e
          kill $WESTON_PID 2>/dev/null || true
          if [ $STATUS -ne 0 ]; then
            echo "Wayland evidence attempt failed with status $STATUS; see artifact wayland_attempt.txt"
            exit $STATUS
          fi

      - name: Upload GUI evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-evidence-${{ runner.os }}
          path: |
            target/evidence_*.json
            target/wayland_attempt.txt
          if-no-files-found: warn

      - name: Summarize GUI evidence
        if: always()
        shell: python
        run: |
          import glob, json, os

          print("## Rust GUI evidence summary\n")
          for path in sorted(glob.glob("target/evidence_*.json")):
              name = os.path.basename(path)
              try:
                  with open(path, encoding="utf-8") as fh:
                      data = json.load(fh)
              except (OSError, ValueError) as error:
                  print(f"- {name}: unreadable ({error})")
                  continue
              renderer = data.get("renderer", {}).get("gl_renderer", "?")
              frames = data.get("frame_times_ms", {})
              worker_close = data.get("worker", {}).get("close_path", {})
              print(f"- **{name}**: all_passed={data.get('all_passed')} "
                    f"renderer={renderer} frames={frames.get('count')} "
                    f"p99={frames.get('p99')}ms worker_close_joined="
                    f"{worker_close.get('joined_within_timeout')}")
          attempt = "target/wayland_attempt.txt"
          if os.path.exists(attempt):
              with open(attempt, encoding="utf-8", errors="replace") as fh:
                  content = fh.read().strip()
              print(f"\nWayland attempt stderr:\n```\n{content[:2000]}\n```")

      - name: Record gate boundary
        shell: bash
        run: |
          echo "This matrix proves build, tests, lint, release compilation, CLI Golden parity, and scripted GUI interaction evidence (real event loop, glow renderer, gesture model, file IO; scripted pointer coordinates)."
          echo "It does not prove renderer hardware coverage beyond the runner GPUs, or physical OLED compatibility."
