name: Package (Rust V2)

# G5 release candidates: build, package, install-test and smoke-test on all three
# platforms. Artifacts are uploaded to the workflow run only; nothing is
# published as a GitHub Release here.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'tools/PACKAGE_RUST_RELEASE.py'
      - 'tools/CHECK_SMOKE_SCREENSHOT.py'
      - '.github/workflows/package.yml'
  workflow_dispatch:
  # release-rust.yml reuses these build and install-test jobs for tagged releases.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Desktop system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev xvfb
      - name: Build release binaries
        run: cargo build --release --locked -p mono-desktop -p mono-cli
      - name: Package
        shell: bash
        run: |
          python tools/PACKAGE_RUST_RELEASE.py --out dist-rust
          echo "VERSION=$(python tools/PACKAGE_RUST_RELEASE.py --print-version)" >> "$GITHUB_ENV"

      - name: Install test (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-rust/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/install" -Force
          $dir = Get-ChildItem "$env:RUNNER_TEMP/install" -Directory | Select-Object -First 1
          $cli = & "$($dir.FullName)/mono.exe" version | Out-String
          $gui = & "$($dir.FullName)/monooled-studio.exe" --version | Out-String
          Write-Output $cli $gui
          if ($gui -notmatch "monooled-studio $([regex]::Escape($env:VERSION))") { throw 'desktop --version mismatch' }
          if ($cli -notmatch [regex]::Escape($env:VERSION)) { throw 'cli version mismatch' }
          "GUI=$($dir.FullName)/monooled-studio.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CLI=$($dir.FullName)/mono.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install test (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist-rust/*.dmg -mountpoint /Volumes/MonoOLED -nobrowse
          cp -R "/Volumes/MonoOLED/MonoOLED Studio.app" "$RUNNER_TEMP/"
          hdiutil detach /Volumes/MonoOLED
          APP="$RUNNER_TEMP/MonoOLED Studio.app/Contents/MacOS"
          "$APP/monooled-studio" --version | tee /dev/stderr | grep -F "monooled-studio $VERSION"
          "$APP/mono" version | tee /dev/stderr | grep -F "$VERSION"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/MonoOLED Studio.app"
          spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/MonoOLED Studio.app" || echo "Gatekeeper rejects the unsigned app (expected; recorded in G5 evidence)"
          echo "GUI=$APP/monooled-studio" >> "$GITHUB_ENV"
          echo "CLI=$APP/mono" >> "$GITHUB_ENV"
      # Linux: install into a clean Ubuntu container so the package's own
      # Depends (not the build step's -dev packages) must provide every runtime
      # library and the CJK font.
      - name: Install test and smoke (Linux deb, clean container)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          mkdir -p smoke
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="$VERSION" ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ./dist-rust/*.deb
            # Test harness only (not a package dependency); with Recommends,
            # because Xvfb cannot start without xkb-data / x11-xkb-utils.
            apt-get install -y xvfb xauth
            dpkg -s monooled-studio | grep -E "^(Status|Version|Depends)"
            monooled-studio --version | grep -F "monooled-studio $VERSION"
            monooled-cli version | grep -F "$VERSION"
            cp -R test_assets/projects/curing_lite /tmp/project
            monooled-cli validate --project /tmp/project/project.oled.json
            monooled-cli export --project /tmp/project/project.oled.json --output /tmp/export
            test -s /tmp/export/ui_contract.json
            export XDG_CONFIG_HOME=/tmp/prefs SLINT_BACKEND=winit-software MONO_TRACE_STARTUP=1
            timeout 300 xvfb-run -a -e /dev/stderr -s "-screen 0 1600x1000x24" monooled-studio /tmp/project --screen main --screenshot /src/smoke/designer-Linux.png
          '

      - name: Installed CLI smoke (validate + export)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          "$CLI" validate --project test_assets/projects/curing_lite/project.oled.json
          "$CLI" export --project test_assets/projects/curing_lite/project.oled.json --output "$RUNNER_TEMP/export"
          test -s "$RUNNER_TEMP/export/ui_contract.json"
      - name: Installed desktop smoke (software renderer screenshot)
        if: runner.os != 'Linux'
        shell: bash
        env:
          SLINT_BACKEND: winit-software
        run: |
          mkdir -p "$RUNNER_TEMP/prefs" smoke
          # Work on a copy: opening a screen updates the project manifest.
          cp -R test_assets/projects/curing_lite "$RUNNER_TEMP/project"
          export APPDATA="$RUNNER_TEMP/prefs" LOCALAPPDATA="$RUNNER_TEMP/prefs" XDG_CONFIG_HOME="$RUNNER_TEMP/prefs"
          "$GUI" "$RUNNER_TEMP/project" --screen main --screenshot "$PWD/smoke/designer-${{ runner.os }}.png"
      - name: Installed desktop smoke (default renderer screenshot)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/project-gl" && cp -R test_assets/projects/curing_lite "$RUNNER_TEMP/project-gl"
          export APPDATA="$RUNNER_TEMP/prefs" LOCALAPPDATA="$RUNNER_TEMP/prefs" XDG_CONFIG_HOME="$RUNNER_TEMP/prefs"
          "$GUI" "$RUNNER_TEMP/project-gl" --screen main --screenshot "$PWD/smoke/designer-${{ runner.os }}-default.png"
      - name: Screenshot content check
        shell: bash
        run: python tools/CHECK_SMOKE_SCREENSHOT.py smoke/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: monooled-studio-${{ runner.os }}
          path: |
            dist-rust/*
            smoke/*.png
          if-no-files-found: error
