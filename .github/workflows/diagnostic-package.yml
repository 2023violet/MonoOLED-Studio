name: Diagnostic Package Timing

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install build deps
        shell: cmd
        run: python -m pip install -r requirements-build.txt
      - name: Timed PyInstaller packaging
        shell: cmd
        run: |
          echo build_time_start=%DATE% %TIME%
          python -m PyInstaller --clean --noconfirm tools\MonoOLEDStudio.spec
          echo build_time_end=%DATE% %TIME%
      - name: Exe smoke
        shell: cmd
        run: |
          "dist\MonoOLEDStudio\MonoOLEDStudio.exe" --check
