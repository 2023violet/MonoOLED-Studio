# Windows release build: author the source, package the executable with
# PyInstaller, produce the deterministic runtime ZIP + SHA-256, and publish a
# GitHub Release. Build steps run on the setup-python interpreter directly;
# they do not go through tools/BUILD_WINDOWS_GA.bat (whose `py` launcher and
# fresh venv are not dependable on the hosted Windows runner).
name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 package and GitHub Release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Bind release tag to src VERSION
        shell: cmd
        run: python tools\VERIFY_RELEASE_TAG.py "%RELEASE_TAG%" --require-git-head
      - name: Install build dependencies
        shell: cmd
        run: python -m pip install -r requirements-build.txt
      - name: Verify release text and package contract
        shell: cmd
        run: |
          python tools\VERIFY_WINDOWS_RELEASE_TEXT.py && python VERIFY_PACKAGE.py
      - name: Build PyInstaller onedir application
        shell: cmd
        run: python -m PyInstaller --clean --noconfirm tools\MonoOLEDStudio.spec
      - name: Executable smoke validation
        shell: cmd
        run: |
          "dist\MonoOLEDStudio\MonoOLEDStudio.exe" --check
          "dist\MonoOLEDStudio\MonoOLEDStudio.exe" --startup-smoke
      - name: Create deterministic release ZIP and SHA-256
        shell: powershell
        run: |
          $ver = (Get-Content 'src\VERSION' -Raw).Trim()
          $gitCommit = (git rev-parse HEAD).Trim()
          $zip = "release\MonoOLEDStudio_v${ver}_Windows_x64.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python tools\BUILD_WINDOWS_RUNTIME_ZIP.py --app-dir "dist\MonoOLEDStudio" --output $zip --version $ver --git-commit $gitCommit
          python tools\BUILD_WINDOWS_RUNTIME_ZIP.py --verify $zip --expected-version $ver --checksum "$zip.sha256" --expected-git-commit $gitCommit
      - name: Preserve Windows build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonoOLEDStudio-${{ env.RELEASE_TAG }}-Windows-x64
          if-no-files-found: warn
          path: |
            release/MonoOLEDStudio_v*_Windows_x64.zip
            release/MonoOLEDStudio_v*_Windows_x64.zip.sha256
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools\PUBLISH_GITHUB_RELEASE.ps1 -Tag "$env:RELEASE_TAG"
