# Windows GA internals are delegated to tools/BUILD_WINDOWS_GA.bat.
# Real-Qt uses QT_SCALE_FACTOR through RUN_WINDOWS_TEST_GROUPS.py at
# 1.0 / 1.25 / 1.5 / 1.75 / 2.0 / 2.25 / 2.5 / 3.0 and auto-discovers
# test_qt_real_interactions_v51.py, test_qt_v80_unified_workspace.py,
# test_qt_v82_studio_select_state_machine.py, test_qt_v82_preferences_theme_surface.py,
# test_qt_v83_reliability.py, test_qt_v84_project_automation.py and current test_qt_*.py.
# Historical V8.2 VERIFY_V82_STRESS.py coverage is retained by the current regression inventory.
# The GA executable phase also performs --startup-smoke, --layout-smoke,
# --settings-smoke, --settings-soak, --interaction-smoke and --soak-smoke before the release ZIP is published.
name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v12.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 GA and GitHub Release
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - name: Bind release tag to src VERSION
        shell: cmd
        run: python tools\VERIFY_RELEASE_TAG.py "%RELEASE_TAG%" --require-git-head
      - name: Build and certify Windows GA
        shell: cmd
        run: tools\BUILD_WINDOWS_GA.bat
      - name: Preserve Windows GA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonoOLEDStudio-${{ env.RELEASE_TAG }}-Windows-x64-GA
          if-no-files-found: warn
          path: |
            release/MonoOLEDStudio_v*_Windows_x64.zip
            release/MonoOLEDStudio_v*_Windows_x64.zip.sha256
            .artifacts/windows_ga/*.xml
            .artifacts/windows_ga/*.log
            .artifacts/windows_ga/settings_v1231_golden/**
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools\PUBLISH_GITHUB_RELEASE.ps1 -Tag "$env:RELEASE_TAG"
