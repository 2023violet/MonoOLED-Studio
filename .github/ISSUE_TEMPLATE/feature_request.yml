name: Feature request
description: Suggest an idea for MonoOLED Studio
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem
        you are trying to solve.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      placeholder: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
